<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SignaturePortal</title>
    <link rel="stylesheet" href="/assets/css/portal.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { background: #fff; }
        .tp-wrap { padding: 12px; max-width: 480px; }
        .tp-status { font-size: 13px; color: #555; margin: 8px 0; min-height: 18px; }
        .tp-status.error { color: #b42318; }
        .tp-list { list-style: none; margin: 0 0 12px 0; padding: 0; }
        .tp-list li { margin: 0 0 6px 0; }
        .tp-list button {
            display: block; width: 100%; text-align: left; cursor: pointer;
            padding: 8px 10px; font-size: 14px; background: #fff;
            border: 1px solid #d0d7de; border-radius: 6px;
        }
        .tp-list button.selected { border-color: #2f6feb; background: #eef4ff; }
        .tp-preview {
            width: 100%; height: 260px; border: 1px solid #d0d7de;
            border-radius: 6px; background: #fff; display: none;
        }
        .tp-insert {
            display: none; margin-top: 10px; padding: 8px 16px; font-size: 14px;
            cursor: pointer; background: #2f6feb; color: #fff; border: 0; border-radius: 6px;
        }
        .tp-insert:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>
<main class="main">
    <div class="tp-wrap">
        <h2 id="tp-title" style="margin:0 0 4px 0;font-size:16px;">Choose signature</h2>
        <div id="tp-status" class="tp-status">Loading…</div>
        <ul id="tp-list" class="tp-list"></ul>
        <iframe id="tp-preview" class="tp-preview" sandbox="allow-same-origin"></iframe>
        <button id="tp-insert" class="tp-insert" type="button">Insert signature</button>
    </div>
</main>
<script src="/addin/taskpane.js"></script>
</body>
</html>
