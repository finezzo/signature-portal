<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add-in harness</title>
<style>
    body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 24px; max-width: 860px; color: #1f2328; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.note { color: #59636e; margin: 0 0 20px; }
    label { display: block; margin: 10px 0 2px; font-weight: 600; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; font: inherit; }
    button { padding: 7px 12px; margin: 14px 6px 0 0; font: inherit; cursor: pointer; }
    iframe { width: 100%; height: 280px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; }
    pre { background: #f6f8fa; padding: 10px; border-radius: 6px; min-height: 70px; white-space: pre-wrap; }
    h2 { font-size: 15px; margin: 22px 0 6px; }
</style>
</head>
<body>
<h1>Add-in harness</h1>
<p class="note">Runs the real <code>public/addin-preview/commands.js</code> against a simulated Outlook and your
portal's real API. Good for fast logic checks. It says nothing about how a real Outlook client behaves, so sideload
the Local dev manifest before promoting anything.</p>

<label for="tenant">Tenant slug</label><input id="tenant" autocomplete="off">
<label for="key">API key</label><input id="key" type="password" autocomplete="off">
<button id="load">Load add-in with these</button>

<label for="primary">Signed-in user (primary mailbox)</label><input id="primary" autocomplete="off">
<label for="from">From</label><input id="from" autocomplete="off">
<label for="to">Recipients (comma-separated)</label><input id="to" autocomplete="off">

<button data-event="onNewMessageComposeHandler">New message</button>
<button data-event="onMessageFromChangedHandler">From changed</button>
<button data-event="onMessageRecipientsChangedHandler">Recipients changed</button>
<button data-event="insertSignatureManual">"Insert signature" button</button>

<h2>Signature in the message</h2>
<iframe id="signature" sandbox></iframe>
<h2>Log</h2>
<pre id="log"></pre>

<script>
(function () {
    "use strict";
    var byId = function (id) { return document.getElementById(id); };
    var value = function (id) { return byId(id).value.trim(); };
    var handlers = {};

    function log(message) {
        byId("log").textContent += new Date().toLocaleTimeString() + "  " + message + "\n";
    }

    function succeeded(result) { return { status: "succeeded", value: result }; }

    // Office.js always answers asynchronously, and the add-in relies on that.
    function later(cb, result) { setTimeout(function () { cb(succeeded(result)); }, 0); }

    function recipients() {
        return value("to").split(",").map(function (a) { return a.trim(); })
            .filter(Boolean).map(function (a) { return { emailAddress: a }; });
    }

    // The part of Office.js the add-in uses, and nothing more.
    window.Office = {
        CoercionType: { Html: "html" },
        AsyncResultStatus: { Succeeded: "succeeded", Failed: "failed" },
        onReady: function (cb) { cb(); },
        actions: { associate: function (name, fn) { handlers[name] = fn; } },
        context: {
            displayLanguage: navigator.language,
            mailbox: {
                userProfile: { get emailAddress() { return value("primary"); } },
                item: {
                    from: { getAsync: function (cb) { later(cb, { emailAddress: value("from") }); } },
                    to:   { getAsync: function (cb) { later(cb, recipients()); } },
                    cc:   { getAsync: function (cb) { later(cb, []); } },
                    bcc:  { getAsync: function (cb) { later(cb, []); } },
                    body: {
                        setSignatureAsync: function (html, _options, cb) {
                            byId("signature").srcdoc = html;
                            log("setSignatureAsync: " + html.length + " characters");
                            later(cb);
                        }
                    },
                    notificationMessages: {
                        replaceAsync: function (_key, message, cb) {
                            log("notification (" + message.type + "): " + message.message);
                            cb();
                        }
                    }
                }
            }
        }
    };

    // commands.js reads tenant and key from the page URL, exactly as in Outlook.
    var params = new URLSearchParams(location.search);
    var fragment = new URLSearchParams(location.hash.slice(1));
    byId("tenant").value = params.get("tenant") || "";
    byId("key").value = fragment.get("key") || "";

    byId("load").addEventListener("click", function () {
        var query = "?tenant=" + encodeURIComponent(value("tenant")) + "&channel=preview";
        var hash = "#key=" + encodeURIComponent(value("key"));
        if (location.search === query) {
            // Only the fragment differs, and that alone wouldn't reload the page.
            location.hash = hash;
            location.reload();
        } else {
            location.href = query + hash;
        }
    });

    document.querySelectorAll("button[data-event]").forEach(function (button) {
        button.addEventListener("click", function () {
            var name = button.getAttribute("data-event");
            if (!handlers[name]) {
                return log("Add-in not loaded yet. Fill in tenant and key, then load it.");
            }
            log("event: " + name);
            handlers[name]({ completed: function () { log("event.completed()"); } });
        });
    });

    if (params.get("tenant")) {
        var script = document.createElement("script");
        script.src = "/addin-preview/commands.js";
        script.onload = function () { log("commands.js loaded"); };
        document.head.appendChild(script);
    }
})();
</script>
</body>
</html>
